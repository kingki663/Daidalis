<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>模型预览 · Manta</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/document-viewer.css">
  <link rel="stylesheet" href="/workspace-ui.css">
  <style>
    .model-preview-page{height:100dvh;display:flex;flex-direction:column}
    .model-preview-page .manta-workbench{flex:1;height:auto;min-height:0}
    .model-preview-controls{display:flex;align-items:center;gap:8px}
    .model-preview-controls label{font-size:11px;color:var(--muted)}
    .model-preview-controls select{font-size:12px;padding:5px 8px}
    .model-preview-footer{padding:10px 20px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}
    .model-preview-footer p+p{margin-top:3px}
    #status[data-error=true]{color:var(--red)}
    @media(max-width:700px){.model-preview-page>.topbar{height:auto;min-height:64px;padding:12px 16px;flex-wrap:wrap}}
  </style>
</head>
<body class="model-preview-page">
  <header class="topbar">
    <div class="breadcrumb"><strong>Manta</strong><span>/</span><span>模型预览</span></div>
    <div class="model-preview-controls">
      <label for="sample">模型</label>
      <select id="sample"><option value="connected">互连演示样例</option><option value="original">仓库原模型</option></select>
    </div>
  </header>
  <main class="manta-workbench" aria-label="模型预览工作区">
    <div class="workbench-tabbar" role="tablist" aria-label="模型文件">
      <span class="workbench-tab active"><button type="button" role="tab" aria-selected="true" aria-controls="current-viewer" id="model-title">模型.sysml</button></span>
    </div>
    <div class="workbench-content">
      <div class="workbench-file-actions"><span id="model-path"></span><button id="reload" type="button">重新读取模型</button></div>
      <div class="workbench-viewer" id="current-viewer" role="tabpanel" aria-labelledby="model-title"></div>
    </div>
  </main>
  <footer class="model-preview-footer">
    <p id="status" role="status">正在加载模型…</p>
    <p id="sample-note"></p>
    <p>当前复用原生结构视图，端口互连优化尚未完成。未执行自然语言生成或动态仿真。</p>
  </footer>
  <script type="module" src="/preview.mjs"></script>
</body>
</html>
